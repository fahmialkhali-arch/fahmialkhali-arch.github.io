<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأستاذ فهمي الخلي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Arial', sans-serif;
            background-color: #ffffff; /* خلفية بيضاء لتتناسب مع الصفحة */
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 750px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent; /* إزالة الخلفية البيضاء */
        }
        
        /* صورة البروشور */
        .main-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* مساحة الأزرار والأيقونات أسفل البروشور */
        .buttons-container {
            width: 100%;
            padding: 20px 10px 30px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            background: transparent; /* إزالة الخلفية البيضاء لتصبح ملتصقة بالصورة */
        }

        /* الصف الأول: الأزرار التفاعلية (3 أزرار) */
        .row-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            width: 100%;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 50px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
            transition: transform 0.2s;
            flex: 1 1 140px;
            max-width: 220px;
            text-align: center;
        }
        
        .btn:hover { transform: scale(1.02); }
        .btn i { font-size: 1.1rem; }

        /* ألوان الأزرار */
        .btn-whatsapp { background: #25D366; }
        .btn-youtube { background: #FF0000; }
        .btn-email { background: #1a2d5e; }

        /* الصف الثاني: أيقونات العرض (Zoom / Meet) */
        .row-icons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            width: 100%;
        }

        .icon-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 50px;
            background-color: #f0f4f8;
            border: 1px solid #e0e0e0;
            color: #333;
            font-weight: 600;
            font-size: 0.9rem;
            flex: 1 1 130px;
            max-width: 180px;
            cursor: default;
        }

        .icon-zoom i { color: #2D8CFF; }
        .icon-meet i { color: #00897B; }

        /* تحسينات الجوال */
        @media (max-width: 550px) {
            .buttons-container { padding: 15px 10px 20px 10px; }
            .btn, .icon-box { flex: 1 1 100%; max-width: 100%; padding: 12px; font-size: 1rem; }
        }
    </style>
</head>
<body>
<div class="container">
    
    <!-- صورة البروشور -->
    <img src="https://i.postimg.cc/BbM0bgHT/ns-fqrtk.png" alt="بروشور الأستاذ فهمي الخلي" class="main-image">

    <!-- الأزرار -->
    <div class="buttons-container">
        
        <!-- الصف الأول: 3 أزرار تفاعلية -->
        <div class="row-buttons">
            <a href="https://wa.me/967777131294" target="_blank" class="btn btn-whatsapp">
                <i class="fab fa-whatsapp"></i> واتساب
            </a>
            <a href="https://youtube.com/@fahmialkhalimath" target="_blank" class="btn btn-youtube">
                <i class="fab fa-youtube"></i> يوتيوب
            </a>
            <a href="mailto:fahmi.Alkhali@gmail.com" class="btn btn-email">
                <i class="fas fa-envelope"></i> البريد الإلكتروني
            </a>
        </div>

        <!-- الصف الثاني: أيقونات العرض -->
        <div class="row-icons">
            <div class="icon-box icon-zoom">
                <i class="fas fa-video"></i> Zoom
            </div>
            <div class="icon-box icon-meet">
                <i class="fas fa-people-arrows"></i> Google Meet
            </div>
        </div>

    </div>

</div>
</body>
</html>
