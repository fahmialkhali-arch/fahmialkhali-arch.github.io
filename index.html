<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأستاذ فهمي الخلي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Arial', sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 750px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .main-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* صندوق الأيقونات (للجوال والكمبيوتر) */
        .buttons-wrapper {
            width: 95%;
            max-width: 550px;
            background-color: #ffffff;
            margin-top: -30px; /* يسحب الأزرار للأعلى لتلتصق بالصورة */
            padding: 20px 15px 25px 15px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            position: relative;
            z-index: 10;
        }

        .row-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            width: 100%;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 25px;
            border-radius: 50px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
            flex: 1 1 30%;
            min-width: 120px;
            text-align: center;
        }
        
        .btn:hover { transform: scale(1.02); }
        .btn i { font-size: 1.2rem; }

        .btn-whatsapp { background: #25D366; }
        .btn-youtube { background: #FF0000; }
        .btn-email { background: #1a2d5e; }

        .row-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            width: 100%;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }

        .icon-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 20px;
            border-radius: 50px;
            background-color: #f8f9fa;
            border: 1px solid #e0e0e0;
            color: #333;
            font-weight: 600;
            font-size: 0.95rem;
            flex: 1 1 30%;
            min-width: 100px;
            cursor: default;
        }

        .icon-zoom i { color: #2D8CFF; }
        .icon-meet i { color: #00897B; }

        @media (max-width: 550px) {
            .buttons-wrapper {
                width: 100%;
                margin-top: -15px;
                border-radius: 20px 20px 0 0; /* استدارة من الأعلى فقط في الجوال */
                box-shadow: 0 -5px 15px rgba(0,0,0,0.05);
            }
            .btn { padding: 14px; font-size: 1.05rem; }
        }
    </style>
</head>
<body>
<div class="container">
    
    <img src="https://i.postimg.cc/BbM0bgHT/ns-fqrtk.png" alt="بروشور الأستاذ فهمي الخلي" class="main-image">

    <div class="buttons-wrapper">
        
        <div class="row-buttons">
            <a href="https://wa.me/967777131294" target="_blank" class="btn btn-whatsapp">
                <i class="fab fa-whatsapp"></i> واتساب
            </a>
            <a href="https://youtube.com/@fahmialkhalimath" target="_blank" class="btn btn-youtube">
                <i class="fab fa-youtube"></i> يوتيوب
            </a>
            <a href="mailto:fahmi.Alkhali@gmail.com" class="btn btn-email">
                <i class="fas fa-envelope"></i> البريد الإلكتروني
            </a>
        </div>

        <div class="row-icons">
            <div class="icon-box icon-zoom">
                <i class="fas fa-video"></i> Zoom
            </div>
            <div class="icon-box icon-meet">
                <i class="fas fa-people-arrows"></i> Google Meet
            </div>
        </div>

    </div>

</div>
</body>
    </html>
